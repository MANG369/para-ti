<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti.</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Elegant Luxury Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0d0205;
        }

        .font-cinzel {
            font-family: 'Cinzel', serif;
        }

        /* 1. FONDO DE PÉTALOS DE ROSAS SOBRE SUPERFICIE CLARA/NIEVE */
        .bg-rose-petals {
            background-image: 
                radial-gradient(circle at center, rgba(15, 5, 8, 0.4) 0%, rgba(5, 1, 3, 0.8) 100%),
                url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* 3. TIPOGRAFÍA DORADA CON RELIEVE Y BRILLO RESPLANDECIENTE */
        .text-gold-gradient {
            background: linear-gradient(135deg, #FFFDF0 0%, #FFD700 35%, #F3A833 60%, #D4AF37 80%, #996515 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 3px 15px rgba(255, 215, 0, 0.85)) 
                    drop-shadow(0px 0px 30px rgba(243, 168, 51, 0.6));
        }

        /* CARD PRINCIPAL CON SUTIL VELO DE CRISTAL */
        .gold-glow-card {
            background: rgba(12, 3, 7, 0.65);
            backdrop-filter: blur(14px);
            border: 1.5px solid rgba(255, 215, 0, 0.45);
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.25),
                        inset 0 0 20px rgba(255, 215, 0, 0.15);
        }

        /* 4 & 5. CONTORNO DORADO CON HAZ DE LUZ RESPLANDECIENTE (BOTÓN Y REPRODUCTOR) */
        .gold-glow-element {
            border: 2px solid #FFD700;
            background: linear-gradient(135deg, rgba(25, 12, 5, 0.85), rgba(45, 20, 5, 0.95));
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6),
                        0 0 40px rgba(243, 168, 51, 0.4),
                        inset 0 0 15px rgba(255, 215, 0, 0.35);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .gold-glow-element:hover {
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.95),
                        0 0 65px rgba(255, 215, 0, 0.7),
                        inset 0 0 25px rgba(255, 215, 0, 0.6);
            transform: translateY(-3px) scale(1.03);
        }

        /* 2. HAZ DE LUZ DORADO ALREDEDOR DEL CORAZÓN (PULSACIÓN CONTINUA) */
        .heart-aura-svg {
            filter: drop-shadow(0px 0px 12px rgba(255, 215, 0, 0.9)) 
                    drop-shadow(0px 0px 30px rgba(243, 168, 51, 0.8));
            animation: heartPulse 3s infinite alternate ease-in-out;
        }

        @keyframes heartPulse {
            0% {
                filter: drop-shadow(0px 0px 10px rgba(255, 215, 0, 0.7)) 
                        drop-shadow(0px 0px 20px rgba(243, 168, 51, 0.5));
                transform: scale(1);
            }
            100% {
                filter: drop-shadow(0px 0px 25px rgba(255, 215, 0, 1)) 
                        drop-shadow(0px 0px 50px rgba(255, 215, 0, 0.9));
                transform: scale(1.04);
            }
        }

        /* DESTELLOS DORADOS FLOTANTES */
        .gold-sparkle {
            position: absolute;
            background: radial-gradient(circle, #FFF8DB 0%, #FFD700 70%, transparent 100%);
            border-radius: 50%;
            pointer-events: none;
            animation: sparkleFloat linear infinite;
        }

        @keyframes sparkleFloat {
            0% {
                opacity: 0;
                transform: translateY(0) scale(0.3);
            }
            50% {
                opacity: 0.8;
            }
            100% {
                opacity: 0;
                transform: translateY(-100vh) scale(1.2);
            }
        }
    </style>
</head>
<body class="bg-rose-petals min-h-screen text-white flex flex-col items-center justify-center p-4 relative overflow-x-hidden">

    <!-- Canvas para animación interactiva de cascada de rosas y corazones -->
    <canvas id="fallingCanvas" class="fixed inset-0 pointer-events-none z-0 w-full h-full"></canvas>

    <!-- Contenedor de Destellos Dorados en Segundo Plano -->
    <div id="sparkle-container" class="fixed inset-0 pointer-events-none z-0"></div>

    <!-- TARJETA PRINCIPAL CENTRADA -->
    <main class="relative z-10 w-full max-w-md mx-auto flex flex-col items-center text-center px-6 py-10 rounded-3xl gold-glow-card my-auto">

        <!-- 2. LOGO EN FORMA DE CORAZÓN CON HAZ DE LUZ DORADO -->
        <div class="relative w-56 h-56 mb-6 flex items-center justify-center">
            
            <!-- Borde exterior SVG en forma de corazón con gradiente dorado resplandeciente -->
            <svg class="absolute inset-0 w-full h-full heart-aura-svg z-10" viewBox="0 0 200 180">
                <defs>
                    <linearGradient id="goldBeamGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#FFFDF0"/>
                        <stop offset="30%" stop-color="#FFD700"/>
                        <stop offset="70%" stop-color="#E2B048"/>
                        <stop offset="100%" stop-color="#996515"/>
                    </linearGradient>
                </defs>
                <path d="M 100,40 C 100,40 80,5 45,5 C 20,5 5,25 5,50 C 5,85 75,125 100,155 C 125,125 195,85 195,50 C 195,25 180,5 155,5 C 120,5 100,40 100,40 Z" 
                      fill="none" 
                      stroke="url(#goldBeamGradient)" 
                      stroke-width="5.5" 
                      stroke-linecap="round"/>
            </svg>

            <!-- Foto del avatar recortada perfectamente dentro del corazón -->
            <div class="w-[185px] h-[166px] relative z-0 flex items-center justify-center overflow-hidden" 
                 style="clip-path: path('M 90,32 C 90,32 72,0 40,0 C 18,0 0,18 0,40 C 0,68 63,100 90,124 C 117,100 180,68 180,40 C 180,18 162,0 140,0 C 108,0 90,32 90,32 Z'); top: -4px;">
                <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=800&auto=format&fit=crop" 
                     alt="Foto de perfil" 
                     class="w-full h-full object-cover transform scale-110 hover:scale-125 transition duration-700">
            </div>
        </div>

        <!-- 3. TITULO: "para ti." EN TEXTO DORADO CON RELIEVE Y BRILLO -->
        <h1 class="text-4xl sm:text-5xl font-extrabold font-cinzel text-gold-gradient tracking-widest mb-2 lowercase">
            para ti.
        </h1>
        
        <p class="text-amber-100/80 text-xs font-light tracking-[0.25em] uppercase mb-8">
            Edición Especial
        </p>

        <!-- 4. BOTÓN "Para ti." CON CONTORNO DORADO Y ENLACE DADO -->
        <a href="https://reham-dawod.github.io/page/" 
           target="_blank" 
           rel="noopener noreferrer"
           class="w-full py-4 px-8 rounded-full font-cinzel font-extrabold text-lg text-amber-200 gold-glow-element flex items-center justify-center gap-3 mb-8 group">
            <i class="fa-solid fa-heart text-amber-400 group-hover:scale-125 transition-transform duration-300"></i>
            <span>Para ti. REHAM | ريهام</span>
            <i class="fa-solid fa-sparkles text-xs text-amber-300"></i>
        </a>

        <!-- 5. REPRODUCTOR DE MÚSICA (SOLO BOTÓN CIRCULAR DE PLAY / PAUSE) -->
        <div class="flex items-center justify-center">
            <button id="playPauseBtn" 
                    aria-label="Reproducir o pausar música"
                    class="w-16 h-16 rounded-full gold-glow-element text-amber-300 flex items-center justify-center text-2xl cursor-pointer active:scale-95">
                <i id="playIcon" class="fa-solid fa-play ml-1"></i>
                <i id="pauseIcon" class="fa-solid fa-pause hidden"></i>
            </button>

            <!-- Audio MP3 Romántico suave -->
            <audio id="romanticAudio" loop preload="metadata">
                <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=romantic-piano-112199.mp3" type="audio/mpeg">
            </audio>
        </div>

    </main>

    <!-- PIE DE PÁGINA -->
    <footer class="relative z-10 mt-6 text-center text-xs text-amber-200/50 font-light tracking-widest">
        Para ti. © Todos los derechos reservados
    </footer>

    <!-- LÓGICA JAVASCRIPT -->
    <script>
        // Lógica del reproductor simplificado
        const audio = document.getElementById('romanticAudio');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');

        playPauseBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
            } else {
                audio.pause();
                pauseIcon.classList.add('hidden');
                playIcon.classList.remove('hidden');
            }
        });

        // ----------------------------------------------------
        // ANIMACIÓN DE CASCADA DE ROSAS Y CORAZONES (CANVAS 2D)
        // ----------------------------------------------------
        const canvas = document.getElementById('fallingCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Tipos de elementos que caen: 'heart' (corazón), 'rose' (rosa) y 'petal' (pétalo)
        const fallingItems = [];
        const itemCount = 50; // Cantidad constante de elementos flotando

        class FallingItem {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = Math.random() * width;
                this.y = initial ? Math.random() * height : -30;
                this.size = Math.random() * 18 + 12; // Tamaño variado
                this.speedY = Math.random() * 1.5 + 0.8; // Velocidad de caída
                this.speedX = Math.sin(Math.random() * Math.PI * 2) * 0.6; // Oscilación horizontal
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.03;
                this.opacity = Math.random() * 0.5 + 0.5;
                
                // Tipo de elemento aleatorio
                const types = ['heart', 'rose', 'petal'];
                this.type = types[Math.floor(Math.random() * types.length)];
                
                // Variaciones de color para rosa/corazón
                this.color = this.type === 'heart' 
                    ? `rgba(${220 + Math.random() * 35}, ${20 + Math.random() * 50}, ${60 + Math.random() * 60}, ${this.opacity})`
                    : `rgba(${180 + Math.random() * 55}, ${10 + Math.random() * 30}, ${30 + Math.random() * 40}, ${this.opacity})`;
            }

            update() {
                this.y += this.speedY;
                this.x += Math.sin(this.y * 0.015) + this.speedX;
                this.rotation += this.rotationSpeed;

                // Reiniciar al salir por la parte inferior de la pantalla
                if (this.y > height + 40) {
                    this.reset(false);
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.fillStyle = this.color;

                if (this.type === 'heart') {
                    // Dibujar Corazón con Resplandor Sutil
                    ctx.shadowColor = 'rgba(255, 215, 0, 0.4)';
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    const topCurveHeight = this.size * 0.3;
                    ctx.moveTo(0, topCurveHeight);
                    // Curva izquierda
                    ctx.bezierCurveTo(
                        -this.size / 2, -topCurveHeight, 
                        -this.size, this.size / 3, 
                        0, this.size
                    );
                    // Curva derecha
                    ctx.bezierCurveTo(
                        this.size, this.size / 3, 
                        this.size / 2, -topCurveHeight, 
                        0, topCurveHeight
                    );
                    ctx.closePath();
                    ctx.fill();
                } else if (this.type === 'rose') {
                    // Dibujar Rosa estilizada (Capullo y Pétalos superpuestos)
                    ctx.shadowColor = 'rgba(255, 100, 150, 0.3)';
                    ctx.shadowBlur = 6;
                    
                    // Pétalo exterior
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * 0.5, 0, Math.PI * 2);
                    ctx.fill();

                    // Espiral/Centro de la Rosa
                    ctx.fillStyle = 'rgba(255, 180, 200, 0.8)';
                    ctx.beginPath();
                    ctx.arc(-this.size * 0.1, -this.size * 0.1, this.size * 0.25, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#8B0000';
                    ctx.beginPath();
                    ctx.arc(this.size * 0.05, this.size * 0.05, this.size * 0.15, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // Dibujar Pétalo de Rosa Suave
                    ctx.beginPath();
                    ctx.ellipse(0, 0, this.size * 0.4, this.size * 0.7, Math.PI / 4, 0, 2 * Math.PI);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        // Inicializar elementos
        for (let i = 0; i < itemCount; i++) {
            fallingItems.push(new FallingItem());
        }

        // Bucle de animación continuo
        function animateFalling() {
            ctx.clearRect(0, 0, width, height);
            
            fallingItems.forEach(item => {
                item.update();
                item.draw();
            });

            requestAnimationFrame(animateFalling);
        }

        // Iniciar la animación al cargar la página
        window.onload = function() {
            animateFalling();
        };

        // Generador de destellos dorados sutiles en pantalla
        function createSparkle() {
            const container = document.getElementById('sparkle-container');
            const sparkle = document.createElement('div');
            sparkle.classList.add('gold-sparkle');
            
            const size = Math.random() * 5 + 2;
            const duration = Math.random() * 5 + 4;
            
            sparkle.style.width = `${size}px`;
            sparkle.style.height = `${size}px`;
            sparkle.style.left = `${Math.random() * 100}vw`;
            sparkle.style.top = '100vh';
            sparkle.style.animationDuration = `${duration}s`;
            
            container.appendChild(sparkle);

            setTimeout(() => {
                sparkle.remove();
            }, duration * 1000);
        }

        setInterval(createSparkle, 350);
    </script>
</body>
</html>
